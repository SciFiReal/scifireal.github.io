baseURL = 'https://scifireal.github.io/'
locale = 'zh-cn'
title = 'SciFiReal'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[languages]
  [languages.zh-cn]
    languageName = "简体中文"
    weight = 1

[outputs]
  home = ["HTML", "JSON"]

[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true
    notAlternative = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "github-dark"
    lineNos = false
    tabWidth = 4
    noClasses = false

[params]
  author = "Hi, I'm SciFiReal"
  description = ""
  defaultTheme = "light"
  disableThemeToggle = false

  ShowToc = true
  TocOpen = true
  TocHLevel = 4
  ShowCodeCopyButtons = true
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowShareButtons = false

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 2
  [[menu.main]]
    name = "标签墙"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    name = "归档"
    url = "/archives/"
    weight = 4
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 5