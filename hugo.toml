baseURL = 'https://scifireal.github.io/'
locale = 'zh-cn'
title = 'AI应用开发'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = "github-dark"
    lineNos = true
    tabWidth = 4
    noClasses = false

[params]
  author = "诺影"
  description = "专注 AI 应用开发、RAG、Agent 与工程实践的个人笔记。"
  defaultTheme = "dark"
  disableThemeToggle = false

  ShowToc = true
  TocOpen = true
  TocHLevel = 4
  ShowCodeCopyButtons = true
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowShareButtons = false

  [params.homeInfoParams]
    Title = "诺影的AI开发笔记"
    Content = "记录 AI 应用开发中的原理、实践、踩坑与工程化思路。"


    [[params.socialIcons]]
      name = "github"
      url = "https://github.com/SciFiReal"

