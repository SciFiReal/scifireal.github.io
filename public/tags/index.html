<script>
(function() {
    'use strict';

    
    var header = document.getElementById('site-header');
    if (header) {
        var onScroll = function() {
            if (window.scrollY > 20) {
                header.classList.add('header--scrolled');
            } else {
                header.classList.remove('header--scrolled');
            }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
    }

    
    function initTocSpy() {
        var tocNav = document.getElementById('toc-nav');
        if (!tocNav) return;

        var links = tocNav.querySelectorAll('a[data-heading]');
        if (links.length === 0) return;

        var headings = [];
        links.forEach(function(link) {
            var id = link.getAttribute('data-heading');
            var heading = document.getElementById(id);
            if (heading) {
                headings.push({ el: heading, link: link });
            }
        });

        if (headings.length === 0) return;

        var activeLink = null;

        function setActive(link) {
            if (activeLink === link) return;
            if (activeLink) activeLink.classList.remove('toc-active');
            if (link) {
                link.classList.add('toc-active');
                
                var sidebar = document.getElementById('sidebar-toc');
                if (sidebar) {
                    var linkRect = link.getBoundingClientRect();
                    var sidebarRect = sidebar.getBoundingClientRect();
                    if (linkRect.top < sidebarRect.top + 40 || linkRect.bottom > sidebarRect.bottom - 20) {
                        link.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    }
                }
            }
            activeLink = link;
        }

        function onScroll() {
            var scrollPos = window.scrollY + 100;
            var current = null;

            for (var i = headings.length - 1; i >= 0; i--) {
                if (headings[i].el.offsetTop <= scrollPos) {
                    current = headings[i];
                    break;
                }
            }

            if (current) {
                setActive(current.link);
            } else if (headings.length > 0) {
                setActive(headings[0].link);
            }
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
    }

    
    function addCodeLangLabels() {
        var blocks = document.querySelectorAll('.post-content pre, .md-content .highlight');
        blocks.forEach(function(block) {
            if (block.querySelector('.code-lang-label')) return;

            var code = block.querySelector('code');
            if (!code) return;

            var lang = '';
            var classes = code.className || '';
            var match = classes.match(/language-(\w+)/);
            if (match) {
                lang = match[1];
            } else {
                match = classes.match(/language-(\S+)/);
                if (match) lang = match[1];
            }

            if (lang) {
                var label = document.createElement('span');
                label.className = 'code-lang-label';
                label.textContent = lang;
                block.style.position = 'relative';
                block.insertBefore(label, block.firstChild);
            }
        });
    }

    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            initTocSpy();
            addCodeLangLabels();
        });
    } else {
        initTocSpy();
        addCodeLangLabels();
    }
})();
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
<script>

            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })
