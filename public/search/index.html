<script>
(function() {
    'use strict';

    
    var header = document.getElementById('site-header');
    if (header) {
        var onScroll = function() {
            if (window.scrollY > 20) {
                header.classList.add('header--scrolled');
            } else {
                header.classList.remove('header--scrolled');
            }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
    }

    
    function initTocSpy() {
        var tocNav = document.getElementById('toc-nav');
        if (!tocNav) return;

        var links = tocNav.querySelectorAll('a[data-heading]');
        if (links.length === 0) return;

        var headings = [];
        links.forEach(function(link) {
            var id = link.getAttribute('data-heading');
            var heading = document.getElementById(id);
            if (heading) {
                headings.push({ el: heading, link: link });
            }
        });

        if (headings.length === 0) return;

        var activeLink = null;

        function setActive(link) {
            if (activeLink === link) return;
            if (activeLink) activeLink.classList.remove('toc-active');
            if (link) {
                link.classList.add('toc-active');
                
                var sidebar = document.getElementById('sidebar-toc');
                if (sidebar) {
                    var linkRect = link.getBoundingClientRect();
                    var sidebarRect = sidebar.getBoundingClientRect();
                    if (linkRect.top < sidebarRect.top + 40 || linkRect.bottom > sidebarRect.bottom - 20) {
                        link.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    }
                }
            }
            activeLink = link;
        }

        function onScroll() {
            var scrollPos = window.scrollY + 100;
            var current = null;

            for (var i = headings.length - 1; i >= 0; i--) {
                if (headings[i].el.offsetTop <= scrollPos) {
                    current = headings[i];
                    break;
                }
            }

            if (current) {
                setActive(current.link);
            } else if (headings.length > 0) {
                setActive(headings[0].link);
            }
        }

        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
    }

    
    function addCodeLangLabels() {
        var blocks = document.querySelectorAll('.post-content pre, .md-content .highlight');
        blocks.forEach(function(block) {
            if (block.querySelector('.code-lang-label')) return;

            var code = block.querySelector('code');
            if (!code) return;

            var lang = '';
            var classes = code.className || '';
            var match = classes.match(/language-(\w+)/);
            if (match) {
                lang = match[1];
            } else {
                match = classes.match(/language-(\S+)/);
                if (match) lang = match[1];
            }

            if (lang) {
                var label = document.createElement('span');
                label.className = 'code-lang-label';
                label.textContent = lang;
                block.style.position = 'relative';
                block.insertBefore(label, block.firstChild);
            }
        });
    }

    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            initTocSpy();
            addCodeLangLabels();
        });
    } else {
        initTocSpy();
        addCodeLangLabels();
    }
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<script>
(function() {
  var fuse = null;
  var searchIndex = null;
  var input = document.getElementById('search-input');
  var resultsEl = document.getElementById('search-results');
  var debounceTimer = null;

  function loadIndex() {
    if (searchIndex) return Promise.resolve(searchIndex);
    return fetch('/index.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        searchIndex = data;
        fuse = new Fuse(data, {
          keys: [
            { name: 'title', weight: 0.4 },
            { name: 'description', weight: 0.2 },
            { name: 'content', weight: 0.3 },
            { name: 'section', weight: 0.1 }
          ],
          threshold: 0.3,
          includeMatches: true,
          minMatchCharLength: 2
        });
        return data;
      });
  }

  function renderResults(results, query) {
    if (results.length === 0) {
      resultsEl.innerHTML = '<div class="search-empty"><p>没有找到相关文章</p><p class="search-hint">试试其他关键词</p></div>';
      return;
    }

    var html = '<div class="search-results-list">';
    results.forEach(function(result) {
      var item = result.item;
      var desc = item.description || '';
      if (!desc && item.content) {
        desc = item.content.substring(0, 150);
      }
      html += '<a class="search-result-item" href="' + item.url + '">';
      html += '<div class="search-result-main">';
      html += '<h2 class="search-result-title">' + escapeHtml(item.title) + '</h2>';
      if (desc) {
        html += '<p class="search-result-desc">' + escapeHtml(desc) + '</p>';
      }
      html += '<div class="search-result-meta">';
      if (item.section) html += '<span>' + escapeHtml(item.section) + '</span>';
      if (item.date) html += '<span>' + item.date + '</span>';
      html += '</div>';
      html += '</div>';
      html += '<div class="search-result-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></div>';
      html += '</a>';
    });
    html += '</div>';
    resultsEl.innerHTML = html;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function doSearch(query) {
    if (!query || query.length < 2) {
      resultsEl.innerHTML = '<div class="search-empty"><p>输入关键词开始搜索</p><p class="search-hint">支持标题、内容、分类模糊匹配</p></div>';
      return;
    }

    loadIndex().then(function() {
      var results = fuse.search(query);
      renderResults(results.slice(0, 20), query);
    });
  }

  input.addEventListener('input', function(e) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
      doSearch(e.target.value.trim());
    }, 200);
  });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      input.value = '';
      resultsEl.innerHTML = '<div class="search-empty"><p>输入关键词开始搜索</p><p class="search-hint">支持标题、内容、分类模糊匹配</p></div>';
      input.blur();
    }
  });

  
  loadIndex();
})();
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");

            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
